name: Trivy security scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'  # weekly, Monday 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-fs:
    name: Filesystem scan (deps, secrets, IaC misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy fs scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scanners: 'vuln,secret,misconfig'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          format: 'table'

  trivy-image:
    name: Docker image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t scan-target:${{ github.sha }} .
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'image'
          image-ref: 'scan-target:${{ github.sha }}'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '0'   # advisory: base-image vulns need manual base bumps
          format: 'table'
